name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-lint:
    name: backend lint + typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --upgrade pip
      - run: pip install ".[dev]"
      - name: ruff
        run: ruff check app tests
      - name: mypy
        run: mypy app

  backend-test:
    name: backend tests + coverage
    runs-on: ubuntu-latest
    needs: backend-lint
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: psdi
          POSTGRES_PASSWORD: psdi_dev_password
          POSTGRES_DB: psdi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U psdi -d psdi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://psdi:psdi_dev_password@localhost:5432/psdi
      TEST_DATABASE_URL_SYNC: postgresql+psycopg://psdi:psdi_dev_password@localhost:5432/psdi
      DATABASE_URL: postgresql+asyncpg://psdi:psdi_dev_password@localhost:5432/psdi
      DATABASE_URL_SYNC: postgresql+psycopg://psdi:psdi_dev_password@localhost:5432/psdi
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-test-secret-please-do-not-use-in-production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --upgrade pip
      - run: pip install ".[dev]"
      - name: alembic upgrade head
        run: alembic upgrade head
      - name: pytest
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=75

  docker-build:
    name: docker compose build
    runs-on: ubuntu-latest
    needs: backend-lint
    steps:
      - uses: actions/checkout@v4
      - name: prepare .env
        run: cp .env.example .env
      - name: build
        run: docker compose build
