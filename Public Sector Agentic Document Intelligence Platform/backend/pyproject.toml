[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "psdi-backend"
version = "0.1.0"
description = "PublicSector Agentic Document Intelligence Platform — backend"
requires-python = ">=3.12,<3.13"
readme = "../README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "PSDI Engineering" }]

dependencies = [
    "fastapi==0.115.4",
    "uvicorn[standard]==0.32.0",
    "sqlalchemy==2.0.35",
    "alembic==1.13.3",
    "asyncpg==0.30.0",
    "psycopg[binary]==3.2.3",
    "pgvector==0.3.6",
    "redis==5.0.8",
    "celery==5.4.0",
    "langchain==0.3.7",
    "langchain-openai==0.2.6",
    "langchain-community==0.3.5",
    "langgraph==0.2.45",
    "openai==1.54.3",
    "mlflow==2.17.2",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "pymupdf==1.24.13",
    "pdfplumber==0.11.4",
    "rank-bm25==0.2.2",
    "tenacity==9.0.0",
    "structlog==24.4.0",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.2.0",
    "python-multipart==0.0.17",
    "boto3==1.35.49",
    "httpx==0.27.2",
    "jinja2==3.1.4",
    "reportlab==4.2.5",
    "sentence-transformers==3.2.1",
    "numpy==1.26.4",
    "scikit-learn==1.5.2",
    "tiktoken==0.8.0",
    "email-validator==2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "respx==0.21.1",
    "ruff==0.7.2",
    "mypy==1.13.0",
    "types-python-jose==3.3.4.20240106",
    "types-passlib==1.7.7.20240819",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP", "SIM", "PL", "RUF"]
ignore = [
    "E501",   # line length handled by formatter
    "PLR0913",  # too many arguments — services need them
    "PLR2004",  # magic numbers in tests are fine
    "B008",   # FastAPI Depends() in defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]
"alembic/**" = ["E402", "F401"]
"app/db/session.py" = ["PLW0603"]
"app/observability/**" = ["PLW0603"]
"app/services/storage_service.py" = ["PLW0603"]
"app/seed/generate_sample_pdfs.py" = ["PLR0915"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_decorators = false
namespace_packages = true
explicit_package_bases = true
files = ["app"]

[[tool.mypy.overrides]]
module = [
    "rank_bm25.*",
    "pgvector.*",
    "pdfplumber.*",
    "fitz.*",
    "passlib.*",
    "jose.*",
    "celery.*",
    "mlflow.*",
    "langchain.*",
    "langchain_openai.*",
    "langchain_community.*",
    "langgraph.*",
    "sentence_transformers.*",
    "reportlab.*",
    "tiktoken.*",
    "boto3.*",
    "botocore.*",
    "sklearn.*",
    "joblib.*",
    "redis.*",
    "redis.asyncio.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra -q"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "slow: tests that spawn subprocesses or take >1s; deselect with `-m 'not slow'`",
]
