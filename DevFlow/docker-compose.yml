services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: devflow
      POSTGRES_PASSWORD: devflow
      POSTGRES_DB: devflow
    ports:
      - "5432:5432"
    volumes:
      - devflow_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devflow -d devflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional: Redis (reserved for background jobs / future scaling)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    profiles:
      - optional

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://devflow:devflow@postgres:5432/devflow
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    # Dev alternative: `npm run dev` with Vite proxy to backend (see README)

  # Optional observability: uncomment to scrape the API /metrics endpoint
  # prometheus:
  #   image: prom/prometheus:v2.54.0
  #   volumes:
  #     - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
  #   ports:
  #     - "9090:9090"
  #   command:
  #     - --config.file=/etc/prometheus/prometheus.yml
  #   depends_on:
  #     - backend
  # grafana:
  #   image: grafana/grafana:11.0.0
  #   environment:
  #     - GF_AUTH_ANONYMOUS_ENABLED=true
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     - prometheus

volumes:
  devflow_pg: {}
