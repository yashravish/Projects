version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ciqalab
      POSTGRES_PASSWORD: ciqalab_pass
      POSTGRES_DB: ciqalab
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ciqalab"]
      interval: 5s
      timeout: 3s
      retries: 10

  device-simulator:
    build: ./device-simulator
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://ciqalab:ciqalab_pass@postgres:5432/ciqalab
      DEVICE_SIMULATOR_URL: http://device-simulator:8001
      FRONTEND_ORIGIN: http://localhost:8080
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      device-simulator:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:8080"
    depends_on:
      - backend

volumes:
  pgdata:
