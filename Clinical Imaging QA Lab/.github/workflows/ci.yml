name: CI — Clinical Imaging QA Lab

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend API Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ciqalab
          POSTGRES_PASSWORD: ciqalab_pass
          POSTGRES_DB: ciqalab
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ciqalab"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      - name: Start device simulator
        run: |
          cd device-simulator
          pip install -r requirements.txt
          uvicorn app.main:app --host 0.0.0.0 --port 8001 &
          sleep 3

      - name: Start backend
        env:
          DATABASE_URL: postgresql://ciqalab:ciqalab_pass@localhost:5432/ciqalab
          DEVICE_SIMULATOR_URL: http://localhost:8001
          FRONTEND_ORIGIN: http://localhost:8080
        run: |
          cd backend
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 3

      - name: Run API tests
        env:
          DATABASE_URL: postgresql://ciqalab:ciqalab_pass@localhost:5432/ciqalab
          BACKEND_URL: http://localhost:8000
          DEVICE_SIMULATOR_URL: http://localhost:8001
        run: python -m pytest tests/api/ -v --tb=short

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://ciqalab:ciqalab_pass@localhost:5432/ciqalab
          BACKEND_URL: http://localhost:8000
          DEVICE_SIMULATOR_URL: http://localhost:8001
        run: python -m pytest tests/integration/ -v --tb=short

  ui-tests:
    name: Playwright UI Tests
    runs-on: ubuntu-latest
    needs: backend-tests

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ciqalab
          POSTGRES_PASSWORD: ciqalab_pass
          POSTGRES_DB: ciqalab
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ciqalab"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install all Python dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r device-simulator/requirements.txt
          pip install -r tests/requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium firefox

      - name: Start device simulator
        run: |
          cd device-simulator
          uvicorn app.main:app --host 0.0.0.0 --port 8001 &
          sleep 3

      - name: Start backend (serving frontend)
        env:
          DATABASE_URL: postgresql://ciqalab:ciqalab_pass@localhost:5432/ciqalab
          DEVICE_SIMULATOR_URL: http://localhost:8001
          FRONTEND_ORIGIN: http://localhost:8000
        run: |
          cd backend
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 3

      - name: Seed test data
        env:
          DATABASE_URL: postgresql://ciqalab:ciqalab_pass@localhost:5432/ciqalab
        run: cd backend && python seed_data.py

      - name: Run Playwright tests (Chromium)
        env:
          FRONTEND_URL: http://localhost:8000
          BACKEND_URL: http://localhost:8000
          DEVICE_SIMULATOR_URL: http://localhost:8001
        run: python -m pytest tests/ui/playwright/ tests/accessibility/ -v --tb=short --browser chromium

      - name: Run Playwright tests (Firefox)
        env:
          FRONTEND_URL: http://localhost:8000
          BACKEND_URL: http://localhost:8000
          DEVICE_SIMULATOR_URL: http://localhost:8001
        run: python -m pytest tests/ui/playwright/ -v --tb=short --browser firefox
